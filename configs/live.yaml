camera:
  index: 0
  backend: msmf
  width: 1280
  height: 720
  fps: 30
  buffer_size: 1
  pixel_format: MJPG

tracking:
  inference_width: 640
  delegate: cpu
  swap_left_right: true
  mirror_horizontal: true
  mirror_depth: false

control:
  smoothing_tau_s: 0.08
  max_target_speed_m_s: 0.30
  return_home_speed_m_s: 0.20
  max_home_displacement_m: [0.18, 0.18, 0.18]
  max_human_jump: 0.20
  perspective_compensation: true
  image_center: [0.5, 0.5]
  depth_deadband: 0.008
  depth_axis_lock: true
  depth_lock_threshold: 0.012
  depth_lock_max_xy_delta: 0.08
  lost_hand_timeout_s: 0.5
  open_gripper_on_loss: true

display:
  panel_width: 480
  panel_height: 360
  render_every_n_frames: 2

ik:
  max_iterations: 20

report_path: outputs/live/latest_live_report.json
