[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-wrist-pinch-retarget"
version = "0.2.0"
description = "Bimanual video hand tracking to OpenArm arms and grippers in MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hieu Nguyen" }]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
vision = [
  "mediapipe>=0.10.14",
  "opencv-python>=4.8",
]
simulation = [
  "mujoco>=3.1",
  "openarm-mujoco>=2.0.0",
]
plot = ["matplotlib>=3.7"]
learning = [
  "joblib>=1.3",
  "scikit-learn>=1.3",
]
all = [
  "mediapipe>=0.10.14",
  "opencv-python>=4.8",
  "mujoco>=3.1",
  "openarm-mujoco>=2.0.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "scikit-learn>=1.3",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
openarm-retarget = "openarm_retarget.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["openarm_retarget"]
